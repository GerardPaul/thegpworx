<header class="snap-start"><!-- header + hero = first screen; snap point on home -->
  <nav class="flex items-center justify-between px-4 py-3 sm:px-6 lg:px-8" aria-label="Main">
    <a routerLink="/" class="flex items-center" aria-label="TheGPWorx home">
      <svg class="h-8 w-8" viewBox="0 0 800 800" fill="currentColor" aria-hidden="true">
        <g transform="translate(0,800) scale(0.1,-0.1)">
          <path d="M4070 4000 l0 -3040 280 0 280 0 2 457 3 457 150 23 c1422 218 2524 1022 2779 2028 323 1276 -786 2519 -2564 2875 -107 21 -234 44 -282 50 l-88 12 0 89 0 89 -280 0 -280 0 0 -3040z m740 2320 c1113 -226 1927 -893 2076 -1701 27 -142 24 -392 -5 -529 -39 -184 -95 -330 -188 -488 -211 -361 -547 -657 -1003 -886 -280 -140 -577 -241 -880 -300 -74 -15 -145 -29 -157 -32 l-23 -4 0 1985 c0 1884 1 1985 18 1985 9 0 82 -13 162 -30z" />
          <path d="M3760 6893 c-1324 -68 -2476 -622 -3032 -1458 -652 -980 -340 -2144 777 -2895 481 -323 1107 -556 1743 -647 l122 -17 0 -123 0 -123 280 0 280 0 0 1370 0 1370 -280 0 -280 0 0 -990 0 -990 -25 0 c-44 0 -307 59 -447 99 -216 64 -379 127 -578 227 -456 229 -792 525 -1003 886 -93 158 -149 304 -188 488 -29 136 -32 387 -6 527 119 652 675 1222 1497 1536 350 134 715 211 1136 239 l174 11 0 249 0 248 -57 -2 c-32 -1 -83 -3 -113 -5z" />
        </g>
      </svg>
    </a>
    <ul class="flex items-center gap-4 text-sm font-medium sm:gap-8">
      @for (link of links; track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="!text-accent" [routerLinkActiveOptions]="{ exact: true }"
             class="font-display text-base text-muted transition-colors hover:text-accent">{{ link.label }}</a>
        </li>
      }
      <li>
        <a routerLink="/" fragment="contact"
           class="btn btn-sm btn-primary">Contact</a>
      </li>
      <li>
        <button type="button" (click)="toggleTheme()" class="hop flex text-muted transition-colors hover:text-accent"
                [attr.aria-label]="dark() ? 'Switch to light mode' : 'Switch to dark mode'">
          <!-- Sun / moon: Pixelarticons (MIT, Gerrit Halfmann) -->
          @if (dark()) {
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M13 22h-2v-3h2zm-6-3H5v-2h2zm12 0h-2v-2h2zm-4-2H9v-2h6zm-6-2H7V9h2zm8 0h-2V9h2zM5 13H2v-2h3zm17 0h-3v-2h3zm-7-4H9V7h6zM7 7H5V5h2zm12 0h-2V5h2zm-6-2h-2V2h2z" />
            </svg>
          } @else {
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M18 22H8v-2h10zM8 20H6v-2h2zm12 0h-2v-2h2zM6 18H4v-2h2zm16 0h-2v-4h-2v-2h2v-2h2zM4 16H2V6h2zm14 0h-6v-2h6zm-6-2h-2v-2h2zm-2-2H8V6h2zM6 6H4V4h2zm8-2h-2v2h-2V4H6V2h8z" />
            </svg>
          }
        </button>
      </li>
    </ul>
  </nav>
</header>
