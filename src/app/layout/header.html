<header class="sticky top-0 z-20 border-b border-white/10 bg-black/60 backdrop-blur">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6" aria-label="Main">
    <a routerLink="/" class="flex items-center gap-2 font-semibold">
      <img src="assets/images/gp_transparent_white_2000x2000.png" alt="" class="h-8 w-8">
      <span class="hidden sm:inline">TheGPWorx</span>
    </a>
    <ul class="flex items-center gap-5 text-sm font-medium sm:gap-8">
      @for (link of links; track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="!text-white" [routerLinkActiveOptions]="{ exact: true }"
             class="text-gray-400 transition hover:text-white">{{ link.label }}</a>
        </li>
      }
      <li>
        <a routerLink="/" fragment="contact"
           class="rounded-full bg-white px-4 py-1.5 text-black transition hover:bg-gray-200">Contact</a>
      </li>
    </ul>
  </nav>
</header>
