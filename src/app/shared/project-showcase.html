<article class="grid items-center gap-6 md:grid-cols-5 md:gap-12">
  <a [routerLink]="['/projects', project().slug]" class="group md:col-span-3" [class]="reverse() ? 'md:order-last' : ''"
     [attr.aria-label]="project().title">
    <app-project-image [src]="project().cover" [alt]="project().title"
                       class="transition duration-300 group-hover:-translate-y-1 group-hover:border-fg/30" />
  </a>
  <div class="md:col-span-2">
    <h3 class="text-2xl font-semibold sm:text-3xl">{{ project().title }}</h3>
    <p class="mt-3 text-muted">{{ project().tagline }}</p>
    <ul class="mt-4 flex flex-wrap gap-2 text-xs">
      @for (t of project().tech; track t) {
        <li class="rounded-full border border-fg/15 px-3 py-1 text-fg/80">{{ t }}</li>
      }
    </ul>
    <a [routerLink]="['/projects', project().slug]" class="mt-6 inline-flex items-center gap-1 font-medium hover:underline">
      View project <span aria-hidden="true">→</span>
    </a>
  </div>
</article>
